name: llama.cpp
files:
- name: llama_cpp.yaml
  options:
  - template: init_config
    options:
    - template: init_config/default
  - template: instances
    options:
    - template: instances/openmetrics
      overrides:
        openmetrics_endpoint.value.example: http://localhost:8080/metrics
        openmetrics_endpoint.description: |
          Endpoint exposing the llama.cpp server Prometheus metrics.

          The llama.cpp server only exposes `/metrics` when started with the
          `--metrics` flag (or the `LLAMA_ARG_ENDPOINT_METRICS=1` environment variable).
