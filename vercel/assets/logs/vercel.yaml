# bypass-global-no-service-config-checks
# bypass-global-grok-parser-rules-checks
id: vercel
backend_only: false
facets:
  - groups:
      - Web Access
    name: URL Path
    path: http.url
    source: log
  - groups:
      - Web Access
    name: URL Host
    path: http.url_details.host
    source: log
  - groups:
      - Web Access
    name: URL Path
    path: http.url_details.path
    source: log
  - groups:
      - Web Access
    name: URL Port
    path: http.url_details.port
    source: log
  - groups:
      - Web Access
    name: URL scheme
    path: http.url_details.scheme
    source: log
  - groups:
      - Geoip
    name: City Name
    path: network.client.geoip.city.name
    source: log
  - groups:
      - Geoip
    name: Continent Code
    path: network.client.geoip.continent.code
    source: log
  - groups:
      - Geoip
    name: Continent Name
    path: network.client.geoip.continent.name
    source: log
  - groups:
      - Geoip
    name: Country ISO Code
    path: network.client.geoip.country.iso_code
    source: log
  - groups:
      - Geoip
    name: Country Name
    path: network.client.geoip.country.name
    source: log
  - groups:
      - Geoip
    name: Subdivision ISO Code
    path: network.client.geoip.subdivision.iso_code
    source: log
  - groups:
      - Geoip
    name: Subdivision Name
    path: network.client.geoip.subdivision.name
    source: log
  - facetType: list
    groups:
      - Vercel
    name: Vercel Deployment Environment
    path: vercel.environment
    source: log
    type: string
  - facetType: list
    groups:
      - Vercel
    name: Vercel Deployment Id
    path: vercel.deploymentId
    source: log
    type: string
  - facetType: list
    groups:
      - Vercel
    name: Vercel Invocation Id
    path: vercel.invocationId
    source: log
    type: string
  - facetType: list
    groups:
      - Vercel
    name: Vercel Project Id
    path: vercel.projectId
    source: log
    type: string
  - facetType: list
    groups:
      - Vercel
    name: Vercel Project Name
    path: vercel.projectName
    source: log
    type: string
  - facetType: range
    groups:
      - Vercel
    name: Vercel Request Duration
    path: vercel.lambda.duration
    source: log
    type: integer
    unit:
      name: nanosecond
      family: time  
pipeline:
  type: pipeline
  name: Vercel
  enabled: true
  filter:
    query: source:vercel
  processors:
    - type: pipeline
      name: Processing for URL Paths
      enabled: true
      filter:
        query: "@proxy.scheme:* @proxy.host:* @proxy.path:* NOT @source:build"
      processors:
        - type: string-builder-processor
          name: Build a parseable http.url from proxy scheme, host, and path
          enabled: true
          template: "%{proxy.scheme}://%{proxy.host}%{proxy.path}"
          target: http.url
          replaceMissing: true
        - type: url-parser
          name: Parse http.url into http.url_details
          enabled: true
          sources:
            - http.url
          target: http.url_details
        - type: url-parser
          name: Parse proxy.referer into http.referer_details
          enabled: true
          sources:
            - proxy.referer
          target: http.referer_details
    - type: grok-parser
      name: Parsing Lambda Report Logs
      enabled: true
      source: message
      samples:
        - "START RequestId: ddb0e0c7-ba4d-457a-b82e-1d40bfb9f1b7 Version: $LATEST\nEND RequestId: ddb0e0c7-ba4d-457a-b82e-1d40bfb9f1b7\nREPORT RequestId: ddb0e0c7-ba4d-457a-b82e-1d40bfb9f1b7\tDuration: 49.44 ms\tBilled Duration: 50 ms\tMemory Size: 1024 MB\tMax Memory Used: 91 MB"
      grok:
        supportRules: ''
        matchRules: 'report_rule .*REPORT RequestId: %{notSpace:lambda.request_id}\s+Duration: %{number:lambda.duration:scale(1000000)} ms\s+Billed Duration: %{number:lambda.billed_duration} ms\s+Memory Size: %{number:lambda.memorysize} MB\s+Max Memory Used: %{number:lambda.max_memory_used} MB(\s+Init Duration: %{number:lambda.init_duration} ms)?.*'
    - type: arithmetic-processor
      name: Calculate Lambda Execution
      enabled: true
      expression: lambda.billed_duration*lambda.memorysize
      target: lambda.execution
      replaceMissing: false
    - type: category-processor
      name: Status Code Remapper
      enabled: true
      categories:
        - filter:
            query: '@type:stdout AND @source:build'
          name: Info
        - filter:
            query: '@proxy.statusCode:[200 TO 299]'
          name: OK
        - filter:
            query: '@proxy.statusCode:[300 TO 399]'
          name: Notice
        - filter:
            query: '@proxy.statusCode:[400 TO 499] OR (@type:stderr AND @source:build) OR message:*warn*'
          name: Warning
        - filter:
            query: '@proxy.statusCode:[500 TO 599] OR (@type:stderr AND NOT @source:build AND NOT message:*warn*)'
          name: Error
      target: http.status_category
    - type: status-remapper
      name: Define `http.status_category` as the official status of the log
      enabled: true
      sources:
        - http.status_category
    - type: service-remapper
      name: Define `projectName` as the official service of the log
      enabled: true
      sources:
        - projectName
    - type: attribute-remapper
      name: Define `deploymentId` as the official version of the log
      enabled: true
      sources:
        - deploymentId
      sourceType: attribute
      target: version
      targetType: tag
      preserveSource: false
      overrideOnConflict: false
    - type: attribute-remapper
      name: Define `environment` as the official env of the log
      enabled: true
      sources:
        - environment
      sourceType: attribute
      target: env
      targetType: tag
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `host` to `url_host`
      enabled: true
      sources:
        - host
      sourceType: attribute
      target: url_host
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: geo-ip-parser
      name: Geo IP mapper
      enabled: true
      sources:
        - proxy.clientIp
      target: network.client.geoip
      ip_processing_behavior: do-nothing
    - type: date-remapper
      name: Define `timestamp` as the official date of the log
      enabled: true
      sources:
        - timestamp
    - type: trace-id-remapper
      name: Define `traceId` as the official trace ID of the log
      enabled: true
      sources:
        - traceId
    - type: span-id-remapper
      name: Define `spanId` as the official span ID of the log
      enabled: true
      sources:
        - spanId
    - type: attribute-remapper
      name: Map `deploymentId` to `vercel.deploymentId`
      enabled: true
      sources:
        - deploymentId
      sourceType: attribute
      target: vercel.deploymentId
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `environment` to `vercel.environment`
      enabled: true
      sources:
        - environment
      sourceType: attribute
      target: vercel.environment
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
    - type: attribute-remapper
      name: Map `invocationId` to `vercel.invocationId`
      enabled: true
      sources:
        - invocationId
      sourceType: attribute
      target: vercel.invocationId
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
   - type: attribute-remapper
      name: Map `projectId` to `vercel.projectId`
      enabled: true
      sources:
        - projectId
      sourceType: attribute
      target: vercel.projectId
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
   - type: attribute-remapper
      name: Map `projectName` to `vercel.projectName`
      enabled: true
      sources:
        - projectName
      sourceType: attribute
      target: vercel.projectName
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
   - type: attribute-remapper
      name: Map `lambda.duration` to `vercel.lambda.duration`
      enabled: true
      sources:
        - lambda.duration
      sourceType: attribute
      target: vercel.lambda.duration
      targetType: attribute
      preserveSource: true
      overrideOnConflict: false
