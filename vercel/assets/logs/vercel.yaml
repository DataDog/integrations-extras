# bypass-global-no-service-config-checks
# bypass-global-grok-parser-rules-checks
id: vercel
backend_only: false
facets:
  - groups:
      - Geoip
    name: City Name
    path: network.client.geoip.city.name
    source: log
  - groups:
      - Geoip
    name: Continent Code
    path: network.client.geoip.continent.code
    source: log
  - groups:
      - Geoip
    name: Continent Name
    path: network.client.geoip.continent.name
    source: log
  - groups:
      - Geoip
    name: Country ISO Code
    path: network.client.geoip.country.iso_code
    source: log
  - groups:
      - Geoip
    name: Country Name
    path: network.client.geoip.country.name
    source: log
  - groups:
      - Geoip
    name: Subdivision ISO Code
    path: network.client.geoip.subdivision.iso_code
    source: log
  - groups:
      - Geoip
    name: Subdivision Name
    path: network.client.geoip.subdivision.name
    source: log
pipeline:
  type: pipeline
  name: Vercel
  enabled: true
  filter:
    query: source:vercel
  processors:
    - type: grok-parser
      name: Parsing Lambda Report Logs
      enabled: true
      source: message
      samples:
        - "START RequestId: ddb0e0c7-ba4d-457a-b82e-1d40bfb9f1b7 Version: $LATEST\nEND RequestId: ddb0e0c7-ba4d-457a-b82e-1d40bfb9f1b7\nREPORT RequestId: ddb0e0c7-ba4d-457a-b82e-1d40bfb9f1b7\tDuration: 49.44 ms\tBilled Duration: 50 ms\tMemory Size: 1024 MB\tMax Memory Used: 91 MB"
      grok:
        supportRules: ''
        matchRules: 'report_rule .*REPORT RequestId: %{notSpace:lambda.request_id}\s+Duration: %{number:lambda.duration:scale(1000000)} ms\s+Billed Duration: %{number:lambda.billed_duration} ms\s+Memory Size: %{number:lambda.memorysize} MB\s+Max Memory Used: %{number:lambda.max_memory_used} MB(\s+Init Duration: %{number:lambda.init_duration} ms)?.*'
    - type: arithmetic-processor
      name: Calculate Lambda Execution
      enabled: true
      expression: lambda.billed_duration*lambda.memorysize
      target: lambda.execution
      replaceMissing: false
    - type: pipeline
      name: Extract Node.js errors from Vercel Function logs for Error Tracking
      enabled: true
      filter:
        # Only error-level or 5xx function logs, and only when nothing upstream
        # already set error data.
        query: "@source:(lambda OR edge) (@level:(error OR fatal) OR @proxy.statusCode:[500 TO 599]) -@error.kind:* -@error.stack:*"
      processors:
        - type: grok-parser
          name: Extract the first Node.js stack trace into `error.stack`, `error.kind` and `error.message`
          enabled: true
          source: message
          samples:
            - "Error: The router state header was sent but could not be parsed.\n    at <unknown> (.next/server/chunks/ssr/[root-of-the-server]__1uyyd8v8upnf3._.js:12:39073)\n    at <unknown> (.next/server/chunks/ssr/[root-of-the-server]__1uyyd8v8upnf3._.js:12:39142)"
            - "START RequestId: 55bf26af-886a-4dfa-be76-8889441f11fa\nError: Unexpected error\n    at handler (/var/task/.next/server/pages/api/products.js:44:11)\nError: Unexpected error\n    at handler (/var/task/.next/server/pages/api/products.js:44:11)\nEND RequestId: 55bf26af-886a-4dfa-be76-8889441f11fa\nREPORT RequestId: 55bf26af-886a-4dfa-be76-8889441f11fa Duration: 375 ms Billed Duration: 376 ms Memory Size: 1024 MB Max Memory Used: 152 MB"
            - "Failed to handle /download Error: The router state header was sent but could not be parsed.\n    at <unknown> (.next/server/chunks/ssr/[root-of-the-server]__1uyyd8v8upnf3._.js:12:39073)"
            - " ⨯ TypeError: Cannot read properties of undefined (reading 'id')\n    at GET (/var/task/.next/server/app/api/items/route.js:1:120) {\n  digest: '1234567890'\n}"
            - "2026-11-06T15:43:17.812Z\t85ea8a46-d63e-4fe3-ad03-ade7c16cd36b\tERROR\tRangeError: Invalid time value\n    at Date.toISOString (<anonymous>)\n    at handler (/var/task/api/date.js:3:22)"
            - "ZodError: [\n  {\n    \"code\": \"invalid_type\"\n  }\n]\n    at handler (/var/task/api/user.js:10:20)"
          grok:
            # `error.kind` and `error.message` are captured inside `error.stack`.
            # The prefix is lazy so the first error header wins (wrapped errors
            # keep the outer kind), and it can span lines (output before the
            # error, START lines, the Lambda console ERROR prefix). A bare
            # `Exception` needs a prefix so "Uncaught Exception: Error: x" is an
            # `Error`. Lines before the first frame are allowed (multi-line
            # messages); a trailing " {" (error properties) is left out of
            # frames. Frame loops are possessive and non-capturing, and the
            # `[CODE]` and first-line scans are bounded, to stay well inside
            # the grok timeout on pathological messages.
            supportRules: |-
              _js_error_kind ([A-Z][A-Za-z0-9_$]*)?Error|[A-Z][A-Za-z0-9_$]+Exception
              _js_line [^\n]{0,2048}+
              _js_error %{_js_error_kind:error.kind}(?:\s?\[[^\]\n]{1,80}+\])?:[ \t]*%{_js_line:error.message}(?:\n(?![ \t]+at\s|END RequestId|REPORT RequestId)[^\n]*+)*?(?:\n[ \t]+at [^\n{]*[^\n{ ])++
            matchRules: |-
              node_error_rule (?:%{data}\s)??(?:⨯\s+)?%{_js_error:error.stack}%{data}
    - type: pipeline
      name: Track `console.error` output without a stack trace in Error Tracking
      enabled: true
      filter:
        # Vercel marks stderr output as error level. Skip logs with error data
        # already set, and START/END/REPORT invocation summaries.
        query: "@source:(lambda OR edge) @type:stderr @level:(error OR fatal) -@error.kind:* -@error.stack:* -@lambda.request_id:*"
      processors:
        - type: grok-parser
          name: Copy `console.error` output to `error.message`
          enabled: true
          source: message
          samples:
            - "This is a error message"
            - "2026-11-06T15:43:17.812Z\t85ea8a46-d63e-4fe3-ad03-ade7c16cd36b\tERROR\tPayment failed for order"
            - "(node:4) [DEP0040] DeprecationWarning: The `punycode` module is deprecated."
            - "Traceback (most recent call last):\n  File \"/var/task/api/index.py\", line 3, in handler"
          grok:
            # Not console.error: Node process warnings, Python tracebacks and
            # logging records, and Go panics.
            supportRules: |-
              _not_console_error (?!\(node:\d+\) )(?!Traceback \(most recent call last\))(?!(?:DEBUG|INFO|WARNING|ERROR|CRITICAL):)(?!panic: )(?!goroutine \d+ )
            matchRules: |-
              lambda_console_error_rule %{notSpace}\t%{notSpace}\tERROR\t%{_not_console_error}%{data:error.message}
              console_error_rule %{_not_console_error}%{data:error.message}
        - type: category-processor
          name: Set `error.kind` to `console.error`
          enabled: true
          categories:
            - filter:
                query: "@error.message:*"
              name: console.error
          target: error.kind
    - type: category-processor
      name: Mark logs with an extracted error as errors
      enabled: true
      categories:
        - filter:
            query: "@error.kind:* OR @error.stack:*"
          name: Error
      target: vercel.error_status
    - type: category-processor
      name: Status Code Remapper
      enabled: true
      categories:
        - filter:
            query: '@proxy.statusCode:[200 TO 299]'
          name: OK
        - filter:
            query: '@proxy.statusCode:[300 TO 399]'
          name: Notice
        - filter:
            query: '@proxy.statusCode:[400 TO 499]'
          name: Warning
        - filter:
            query: '@proxy.statusCode:[500 TO 599]'
          name: Error
      target: http.status_category
    - type: status-remapper
      name: Define `vercel.error_status`, then `http.status_category`, as the official status of the log
      enabled: true
      sources:
        - vercel.error_status
        - http.status_category
    - type: service-remapper
      name: Define `projectName` as the official service of the log
      enabled: true
      sources:
        - projectName
    - type: attribute-remapper
      name: Map `host` to `url_host`
      enabled: true
      sources:
        - host
      sourceType: attribute
      target: url_host
      targetType: attribute
      preserveSource: false
      overrideOnConflict: false
    - type: geo-ip-parser
      name: Geo IP mapper
      enabled: true
      sources:
        - proxy.clientIp
      target: network.client.geoip
      ip_processing_behavior: do-nothing
    - type: date-remapper
      name: Define `timestamp` as the official date of the log
      enabled: true
      sources:
        - timestamp
    - type: trace-id-remapper
      name: Define `traceId` as the official trace ID of the log
      enabled: true
      sources:
        - traceId
    - type: span-id-remapper
      name: Define `spanId` as the official span ID of the log
      enabled: true
      sources:
        - spanId
metrics:
  - name: vercel.functions.invocations
    query: source:vercel @source:lambda REPORT
    groupBys:
      - path: '@projectName'
        tagName: project_name
      - path: '@path'
        tagName: path
      - path: '@branch'
        tagName: branch
      - path: '@environment'
        tagName: environment
      - path: '@projectId'
        tagName: project_id
      - path: '@statusCode'
        tagName: status_code
      - path: '@proxy.host'
        tagName: proxy_host
      - path: '@proxy.method'
        tagName: request_method
      - path: '@proxy.pathType'
        tagName: path_type
      - path: '@proxy.region'
        tagName: region
      - path: '@proxy.vercelCache'
        tagName: vercel_cache
      - path: '@source'
        tagName: source
  - name: vercel.functions.errors
    query: source:vercel @source:lambda status:error REPORT
    groupBys:
      - path: '@projectName'
        tagName: project_name
      - path: '@path'
        tagName: path
      - path: '@branch'
        tagName: branch
      - path: '@environment'
        tagName: environment
      - path: '@projectId'
        tagName: project_id
      - path: '@statusCode'
        tagName: status_code
      - path: '@proxy.host'
        tagName: proxy_host
      - path: '@proxy.method'
        tagName: request_method
      - path: '@proxy.pathType'
        tagName: path_type
      - path: '@proxy.region'
        tagName: region
      - path: '@proxy.vercelCache'
        tagName: vercel_cache
      - path: '@source'
        tagName: source
  - name: vercel.functions.duration
    query: source:vercel @source:lambda REPORT
    groupBys:
      - path: '@projectName'
        tagName: project_name
      - path: '@path'
        tagName: path
      - path: '@branch'
        tagName: branch
      - path: '@environment'
        tagName: environment
      - path: '@projectId'
        tagName: project_id
      - path: '@statusCode'
        tagName: status_code
      - path: '@proxy.host'
        tagName: proxy_host
      - path: '@proxy.method'
        tagName: request_method
      - path: '@proxy.pathType'
        tagName: path_type
      - path: '@proxy.region'
        tagName: region
      - path: '@proxy.vercelCache'
        tagName: vercel_cache
      - path: '@source'
        tagName: source
    aggregation:
      path: '@lambda.duration'
      includePercentiles: true
  - name: vercel.functions.execution
    query: source:vercel @source:lambda REPORT
    groupBys:
      - path: '@projectName'
        tagName: project_name
      - path: '@path'
        tagName: path
      - path: '@branch'
        tagName: branch
      - path: '@environment'
        tagName: environment
      - path: '@projectId'
        tagName: project_id
      - path: '@statusCode'
        tagName: status_code
      - path: '@proxy.host'
        tagName: proxy_host
      - path: '@proxy.method'
        tagName: request_method
      - path: '@proxy.pathType'
        tagName: path_type
      - path: '@proxy.region'
        tagName: region
      - path: '@proxy.vercelCache'
        tagName: vercel_cache
      - path: '@source'
        tagName: source
    aggregation:
      path: '@lambda.execution'
      includePercentiles: true
  - name: vercel.functions.max_memory_used
    query: source:vercel @source:lambda REPORT
    groupBys:
      - path: '@projectName'
        tagName: project_name
      - path: '@path'
        tagName: path
      - path: '@branch'
        tagName: branch
      - path: '@environment'
        tagName: environment
      - path: '@projectId'
        tagName: project_id
      - path: '@statusCode'
        tagName: status_code
      - path: '@proxy.host'
        tagName: proxy_host
      - path: '@proxy.method'
        tagName: request_method
      - path: '@proxy.pathType'
        tagName: path_type
      - path: '@proxy.region'
        tagName: region
      - path: '@proxy.vercelCache'
        tagName: vercel_cache
      - path: '@source'
        tagName: source
    aggregation:
      path: '@lambda.max_memory_used'
      includePercentiles: true
  - name: vercel.functions.memorysize
    query: source:vercel @source:lambda REPORT
    groupBys:
      - path: '@projectName'
        tagName: project_name
      - path: '@path'
        tagName: path
      - path: '@branch'
        tagName: branch
      - path: '@environment'
        tagName: environment
      - path: '@projectId'
        tagName: project_id
      - path: '@statusCode'
        tagName: status_code
      - path: '@proxy.host'
        tagName: proxy_host
      - path: '@proxy.method'
        tagName: request_method
      - path: '@proxy.pathType'
        tagName: path_type
      - path: '@proxy.region'
        tagName: region
      - path: '@proxy.vercelCache'
        tagName: vercel_cache
      - path: '@source'
        tagName: source
    aggregation:
      path: '@lambda.memorysize'
      includePercentiles: false
  - name: vercel.requests
    query: source:vercel ((@source:lambda REPORT) OR @source:static)
    groupBys:
      - path: '@projectName'
        tagName: project_name
      - path: '@path'
        tagName: path
      - path: '@branch'
        tagName: branch
      - path: '@environment'
        tagName: environment
      - path: '@projectId'
        tagName: project_id
      - path: '@statusCode'
        tagName: status_code
      - path: '@proxy.host'
        tagName: proxy_host
      - path: '@proxy.method'
        tagName: request_method
      - path: '@proxy.pathType'
        tagName: path_type
      - path: '@proxy.region'
        tagName: region
      - path: '@proxy.vercelCache'
        tagName: vercel_cache
      - path: '@source'
        tagName: source
  - name: vercel.projects.build_count
    query: source:vercel "Build completed in"
    groupBys:
      - path: '@projectName'
        tagName: project_name
      - path: '@projectId'
        tagName: project_id
