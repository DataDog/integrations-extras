name: Hugging Face TEI
files:
- name: hugging_face_tei.yaml
  options:
  - template: init_config
    options:
    - template: init_config/default
  - template: instances
    options:
    - template: instances/openmetrics
      overrides:
        openmetrics_endpoint.value.example: http://localhost:8080/metrics
        openmetrics_endpoint.description: |
          Endpoint exposing the Text Embeddings Inference Prometheus metrics.

          The HTTP server serves `/metrics` on the same port as the inference API.
          The gRPC build serves it on the port set by `--prometheus-port` (default 9000).
