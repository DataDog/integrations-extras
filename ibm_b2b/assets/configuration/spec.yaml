name: ibm_b2b
files:
- name: ibm_b2b.yaml
  options:
  - template: init_config
    options:
    - template: init_config/default
  - template: instances
    options:
    - name: url
      required: true
      description: Base URL of the IBM Sterling Connect Web Services API.
      value:
        type: string
        example: https://connect-direct.example.com:port
    - name: username
      required: true
      description: Username used to authenticate with IBM Sterling Connect Web Services.
      value:
        type: string
        example: <USERNAME>
    - name: password
      required: true
      secret: true
      description: Password used to authenticate with IBM Sterling Connect Web Services.
      value:
        type: string
        example: <PASSWORD>
    - name: cd_node
      required: true
      description: IP address or host name of the IBM Connect:Direct node to sign on to.
      value:
        type: string
        example: 192.0.2.10
    - name: cd_port
      description: Port of the IBM Connect:Direct node.
      value:
        type: integer
        example: 1363
        default: 1363
    - name: cd_protocol
      description: Protocol used to connect to the IBM Connect:Direct node.
      value:
        type: string
        example: TCPIP
        default: TCPIP
    - name: tls_verify
      description: Verify the server TLS certificate.
      value:
        type: boolean
        example: true
        default: true
    - name: timeout
      description: HTTP request timeout in seconds.
      value:
        type: number
        example: 10
        default: 10
    - name: statistics_lookback_minutes
      description: Lookback window used to query IBM Connect:Direct statistics, including intentional overlap between check runs.
      value:
        type: integer
        example: 2
        default: 2
    - name: statistics_timezone
      description: IANA timezone of the IBM Connect:Direct server used to calculate statistics query times.
      value:
        type: string
        example: America/Chicago
    - template: instances/default
