name: Volcano
files:
- name: volcano.yaml
  options:
  - template: init_config
    options:
    - template: init_config/default
  - template: instances
    options:
    - template: instances/openmetrics
      overrides:
        openmetrics_endpoint.value.example: http://localhost:8080/metrics
        openmetrics_endpoint.description: |
          Endpoint exposing the Volcano Prometheus metrics.

          The scheduler serves metrics on port 8080 and the controller manager on port 8081.
          Configure one instance per component.
