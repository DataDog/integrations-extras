# Validations enabled for `ddev validate all` (see .github/workflows/validate.yml).
# Same set the frozen integrations-core run-validations workflow ran for this repo.
validations = [
    "ci",
    "config",
    "imports",
    "integration-style",
    "jmx-metrics",
    "legacy-signature",
    "metadata",
    "models",
    "package",
    "readmes",
    "codeowners",
]

[overrides.display-name]
contrastsecurity = "Contrast Security"
gnatsd_streaming = "Gnatsd Streaming"
reboot_required = "Reboot Required"
storm = "Storm"

[overrides.metrics-prefix]
aerospike_enterprise = "aerospike."
snmpwalk = "snmpwalk."
warpstream = "warpstream."

[overrides.is-integration]
fluxcd = false
traefik = false
