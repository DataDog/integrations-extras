name: Trigger Wheel Builds

# The legacy GitLab release job owns signing and tag creation. This receiver
# delegates detection, validation, and wheel dispatch to integrations-core.

on:
  # Automatic push triggering is intentionally disabled. The legacy GitLab release
  # job dispatches this workflow with the exact signed SHA after pushing all tags.
  workflow_dispatch:
    inputs:
      packages:
        description: >-
          Packages to release. JSON array (e.g. '["postgres","datadog_checks_base"]'),
          or omit to auto-detect from tags pointing at the specified ref.
        required: false
        type: string
      source-repo-ref:
        description: "Commit SHA or ref to build from"
        required: true
        type: string
      dry-run:
        description: "Print what would be released without pushing tags or starting builds"
        required: false
        type: boolean
        default: false
      ddev-version:
        description: "ddev version, pinned by default."
        required: false
        type: string

concurrency:
  group: release-${{ inputs.source-repo-ref }}
  cancel-in-progress: false

jobs:
  context:
    name: Detect release context
    runs-on: ubuntu-latest
    outputs:
      is-stable-release: ${{ steps.detect.outputs.is-stable-release }}
    steps:
      - id: detect
        run: |
          if [[ "$GITHUB_REF" == refs/heads/master ]]; then
            echo "is-stable-release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-stable-release=false" >> "$GITHUB_OUTPUT"
          fi

  dispatch:
    name: Release
    needs: context
    uses: DataDog/integrations-core/.github/workflows/release-dispatch.yml@master
    with:
      source-repo: integrations-extras
      packages: ${{ inputs.packages || '' }}
      source-repo-ref: ${{ inputs.source-repo-ref }}
      source-repo-branch: master
      create-tags: false
      dry-run: ${{ inputs.dry-run || false }}
      ddev-version: ${{ inputs.ddev-version || '' }}
      is-stable-release: ${{ needs.context.outputs.is-stable-release }}
    permissions:
      id-token: write
      contents: read

  track:
    name: Record release deployment
    needs: dispatch
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - name: Record successful dispatch
        env:
          SOURCE_REPO_REF: ${{ inputs.source-repo-ref }}
        run: echo "Wheel build dispatch completed for ${SOURCE_REPO_REF}"
