name: PR

on:
  pull_request:
    branches:
    - master
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.head_ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: DataDog/integrations-core/.github/workflows/pr-test.yml@b466d14c32e86debf258fdef76034c19c23fc762
    with:
      repo: extras
      python-version: "3.13"
      ddev-version: "==21.0.0"
    secrets: inherit
    permissions:
       # needed for dd-sts-action in test-target.yml, allows the action to get a JWT signed by Github
       id-token: write
       # needed for compute-matrix in test-target.yml
       contents: read
