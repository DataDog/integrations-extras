name: Amazon VPC CNI
files:
- name: amazon_vpc_cni.yaml
  options:
  - template: init_config
    options:
    - template: init_config/default
  - template: instances
    options:
    - template: instances/openmetrics
      overrides:
        openmetrics_endpoint.value.example: http://localhost:61678/metrics
        openmetrics_endpoint.description: |
          Endpoint exposing the Amazon VPC CNI Prometheus metrics.

          The `aws-node` DaemonSet runs with host networking, so `localhost` only
          resolves to the IPAMD endpoint when the Agent also runs with host
          networking (or directly on the node host). If the Agent runs as a pod
          without host networking, set this to the node's IP address, for example
          `http://<NODE_IP>:61678/metrics`, or use Autodiscovery with a template
          that resolves the node address.
